name: MerkOfDutyNative
options:
  bundleIdPrefix: com.kremcheats
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    CODE_SIGN_STYLE: Manual
targets:
  MerkOfDutyNative:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: MerkOfDuty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kremcheats.merkofduty.native
        PRODUCT_NAME: MerkOfDutyNative
        INFOPLIST_FILE: MerkOfDuty/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
